<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BL Animator Mobile</title>
  <style>
    :root {
      --bg: #121215;
      --panel: #1e1e24;
      --border: #333;
      --text: #e0e0e0;
      --accent: #6366f1;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 8px;
      user-select: none;
    }

    .wrapper { max-width: 100%; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      background: var(--panel);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: white;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--border);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(16, 40px);
      grid-template-rows: repeat(16, 40px);
      gap: 2px;
      background: var(--border);
      width: fit-content;
      margin: auto;
    }

    .cell {
      width: 100%;
      height: 100%;
      cursor: pointer;
      transition: transform 0.05s, background 0.2s;
      background-color: #1a1a1a;
    }

    .cell:hover {
      transform: scale(0.98);
      background-color: #333;
    }

    #typewriter-view {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      background: #2a2a30;
      color: white;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="toolbar">
      <button onclick="switchMode('animator')" id="btn-animator" class="active">Animator (Сетка)</button>
      <button onclick="switchMode('typewriter')">Typewriter</button>
    </div>

    <div id="animator-view">
      <div class="grid-container" id="grid"></div>
    </div>

    <div id="typewriter-view">
      <textarea id="tw-input" placeholder="Введи текст..."></textarea>
      <div id="tw-output" style="margin-top: 10px; color: #aaa;"></div>
    </div>
  </div>

  <script>
    const SIZE = 16;
    let frames = ;
    let currentFrameIndex = 0;

    function init() {
      frames = [createEmptyFrame()];
      renderGrid();
    }

    function createEmptyFrame() {
      return Array.from({ length: SIZE }, () => Array(SIZE).fill('#1a1a1a'));
    }

    function renderGrid() {
      const gridContainer = document.getElementById('grid');
      gridContainer.innerHTML = '';
      
      const currentFrame = frames[currentFrameIndex];

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const pixel = document.createElement('div');
          pixel.className = 'cell';
          pixel.style.backgroundColor = currentFrame[y][x];
          
          pixel.onclick = () => {
            const hex = prompt('Введите цвет (hex, например #FF0000):', currentFrame[y][x]);
            if (hex) {
              currentFrame[y][x] = hex;
              pixel.style.backgroundColor = hex;
            }
          };
          
          gridContainer.appendChild(pixel);
        }
      }
    }

    function switchMode(mode) {
      document.getElementById('animator-view').style.display = mode === 'animator' ? 'block' : 'none';
      document.getElementById('typewriter-view').style.display = mode === 'typewriter' ? 'block' : 'none';
      
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    init();
  </script>
</body>
</html>
